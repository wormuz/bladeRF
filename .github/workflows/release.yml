# Publish a release from artefacts built locally.
#
# This workflow does NOT build anything. Bitstreams come out of Quartus on a
# machine with the toolchain installed, and FX3 firmware out of the Cypress
# SDK; neither belongs in CI here. What CI does is take files that already
# exist, check they are the ones claimed, and attach them to a tag.
#
# Usage:
#   1. Build locally, then stage the artefacts:
#        tools/stage_release.sh <version>
#      which copies the .rbf/.img, writes the checksums, and leaves
#      everything under release-staging/<version>/
#   2. Commit nothing -- the staging directory is ignored on purpose. Push
#      the tag:
#        git tag -a v0.16.1 -m "..." && git push origin v0.16.1
#   3. Run this workflow against that tag, with the staging directory
#      uploaded as a workflow artefact first (see the manual-dispatch path
#      below), or attach the files by hand.
#
# The checksum verification is the point. A release whose .rbf does not
# match its own .sha256sum is worse than no release: it looks official.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download staged artefacts
        uses: actions/download-artifact@v4
        with:
          name: release-artefacts
          path: artefacts
        continue-on-error: true

      - name: Verify checksums
        run: |
          set -eu
          if [ ! -d artefacts ] || [ -z "$(ls -A artefacts 2>/dev/null)" ]; then
            echo "No artefacts were staged for this tag."
            echo "Build locally and upload them as the 'release-artefacts'"
            echo "workflow artefact before running this."
            exit 1
          fi
          cd artefacts
          fail=0
          for sum in *.sha256sum; do
            [ -e "$sum" ] || continue
            if sha256sum -c "$sum"; then
              echo "ok   $sum"
            else
              echo "FAIL $sum"
              fail=1
            fi
          done
          # A bitstream without a checksum beside it is an unverifiable
          # artefact, which is exactly what this step exists to prevent.
          for f in *.rbf *.img; do
            [ -e "$f" ] || continue
            if [ ! -e "$f.sha256sum" ]; then
              echo "FAIL $f has no .sha256sum"
              fail=1
            fi
          done
          exit $fail

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artefacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Built locally, not in CI: bitstreams need Quartus and the FX3
            firmware needs the Cypress SDK. Every file here was checked
            against its own `.sha256sum` before publication.

            Verify after download:

                sha256sum -c hostedxA4.rbf.sha256sum
